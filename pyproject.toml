[project]
name = "tdr-assessment-scripts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.101",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "requests>=2.34.2",
]

[tool.uv]
# This repo is worked on from within a OneDrive-synced folder, which does not
# support hardlinking into the uv cache. Without this, `uv sync` fails with
# "cloud operation cannot be performed on a file with incompatible hardlinks."
link-mode = "copy"
